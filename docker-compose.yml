services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/booking
      DB_USER: booking
      DB_PASSWORD: booking
      # troque em qualquer ambiente real; precisa ter no mínimo 32 caracteres
      JWT_SECRET: dev-only-secret-change-me-please-0123456789
    ports:
      - "8080:8080"
