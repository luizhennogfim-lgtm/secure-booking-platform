spring:
  application:
    name: secure-booking-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    ttl-minutes: 60
  seed:
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    provider-password: ${PROVIDER_PASSWORD:Provider@12345}

management:
  endpoints:
    web:
      exposure:
        include: health
